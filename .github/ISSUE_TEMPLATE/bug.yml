name: Gluon bug report
description: Report a reproducible installation, launch, graphics, or compatibility issue.
body:
  - type: markdown
    attributes:
      value: Check the [wiki](https://github.com/dotjxl/gluon/wiki) and existing issues first. Review logs for private details before posting.
  - type: input
    id: version
    attributes:
      label: Gluon version, Steam build, macOS version, and Mac chip
      placeholder: Gluon RC, Steam build number, macOS version, Apple chip
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and Steam App ID, if applicable
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: For startup issues, include cold or repeat launch and the time from Play to the game window.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: Share a short redacted excerpt from the launcher, Wine, or installer log.
      render: text
